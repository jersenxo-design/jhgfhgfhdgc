<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Вход — QalaPass</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<script>if(localStorage.getItem("qalaSession"))location.replace("index.html")</script>
<div class="auth-body">
<aside class="auth-side"><span class="orb o1"></span><span class="orb o2"></span><a class="brand" href="auth.html"><span class="brand-mark" style="background:var(--lime);color:var(--ink)">Q</span><span>qala<span class="brand-light">pass</span></span></a><div><h1>Твой город.<br><em>Твои планы.</em></h1><p>Войди или создай аккаунт, чтобы видеть афишу, туры и сохранять любимое.</p></div><small style="color:#8b8b96">Связь: Telegram @jerryzzxo · jersenxo@gmail.com</small></aside>
<section class="auth-panel"><div class="auth-box"><div class="tabs"><button class="on" data-tab="login">Войти</button><button data-tab="register">Регистрация</button></div>
<form id="loginForm"><label>Почта<input name="email" type="email" required placeholder="you@mail.com" autocomplete="email"></label><label>Пароль<input name="password" type="password" required placeholder="••••••" autocomplete="current-password"></label><p class="auth-error" id="loginError"></p><button class="button button-dark" type="submit">Войти ↗</button></form>
<form id="registerForm" class="hidden"><label>Имя<input name="name" required placeholder="Как тебя зовут?" autocomplete="name"></label><label>Почта<input name="email" type="email" required placeholder="you@mail.com" autocomplete="email"></label><label>Пароль<input name="password" type="password" required minlength="6" placeholder="минимум 6 символов" autocomplete="new-password"></label><label>Повтори пароль<input name="password2" type="password" required placeholder="ещё раз" autocomplete="new-password"></label><p class="auth-error" id="registerError"></p><button class="button button-lime" type="submit">Создать аккаунт ↗</button></form>
<p class="auth-note">Демо-режим: аккаунты хранятся только в твоём браузере.</p></div></section></div>
<script src="app.js"></script></body></html>
